name: Deploy DevTube Backend to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Pull and restart via pm2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          script: |
            set -e
            export PATH="$PATH:$HOME/.bun/bin"
            cd /srv/apps/DevTube-backend
            git pull origin main
            chmod +x ./pm2.sh
            ./pm2.sh
